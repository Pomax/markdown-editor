name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check-label:
    if: "!contains(github.event.pull_request.labels.*.name, 'no-ci')"
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI not skipped"

  test-windows:
    needs: check-label
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          dotnet tool install --global SetResolution
          $video = Get-CimInstance Win32_VideoController
          SetResolution SET -w 1920 -h 1080 -f $video.CurrentRefreshRate -b $video.CurrentBitsPerPixel -noprompt
        shell: pwsh
      - run: npm ci --ignore-scripts && npm run setup && npm test

  test-macos:
    needs: check-label
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          brew install displayplacer
          displayplacer list
          displayplacer "id:$(displayplacer list | grep -m1 'Persistent screen id' | cut -d' ' -f4) res:1600x1200"
          displayplacer list | grep -m1 'Resolution:'
          npm ci --ignore-scripts && npm run setup && npm test

  test-linux:
    needs: check-label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb openbox
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci --ignore-scripts && npm run setup && npm test
