name: Build Executables

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci --ignore-scripts
      - name: Install UPX
        shell: cmd
        run: |
          curl -fsSL -o "%RUNNER_TEMP%\upx.zip" https://github.com/upx/upx/releases/download/v5.2.1/upx-5.2.1-win64.zip || exit /b 1
          "%SystemRoot%\System32\tar.exe" -xf "%RUNNER_TEMP%\upx.zip" -C "%RUNNER_TEMP%" || exit /b 1
          echo %RUNNER_TEMP%\upx-5.2.1-win64>>"%GITHUB_PATH%"
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: build-windows
          path: dist/windows/*
          retention-days: 1

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci --ignore-scripts
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v7
        with:
          name: build-macos
          path: dist/macos/*
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci --ignore-scripts
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: build-linux
          path: dist/ubuntu/*
          retention-days: 1

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Get version from package.json
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: build-windows
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: build-macos
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: build-linux
          path: artifacts
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          # Delete existing release and tag if they exist
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          # Create new release with all artifacts
          gh release create "$TAG" artifacts/* \
            --title "Markdown Editor $TAG" \
            --notes "Standalone executables for Windows, macOS, and Linux." \
            --latest
