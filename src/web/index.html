<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https: http:; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: https: http:; frame-src https: http:">
    <title>Markdown Editor</title>
    <style>
        @import url("styles/main.css") layer(app);
        @import url("styles/editor.css") layer(app);
        @import url("styles/writing-view.css") layer(app);
        @import url("styles/source-view-v2.css") layer(app);
        @import url("styles/toolbar.css") layer(app);
        @import url("styles/preferences.css") layer(app);
        @import url("styles/image.css") layer(app);
        @import url("styles/link.css") layer(app);
        @import url("styles/table.css") layer(app);
        @import url("styles/toc.css") layer(app);
        @import url("styles/word-count.css") layer(app);
        @import url("styles/tab-bar.css") layer(app);
        @import url("styles/search.css") layer(app);
        @import url("styles/code-language.css") layer(app);
    </style>
</head>
<body>
    <div id="app">
        <div id="toolbar-container"></div>
        <div id="content-wrapper" class="toc-position-left">
            <div id="toc-sidebar"></div>
            <div id="editor-container">
                <div id="editor" class="editor" contenteditable="true" spellcheck="false"></div>
            </div>
        </div>
        <div id="tab-bar"></div>
    </div>
    <script type="module" src="scripts/app.js"></script>
</body>
</html>
