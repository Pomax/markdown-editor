[package]
name = "markdown-editor"
version = "3.2.0"
description = "Pomax's markdown editor"
authors = ["Pomax"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"
default-run = "markdown-editor"
build = "src/tauri/build.rs"
autobins = false
autoexamples = false
autotests = false
autobenches = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "markdown-editor"
path = "src/tauri/main.rs"

[[bin]]
name = "win-runner"
path = "src/tauri/bin/win-runner.rs"
required-features = ["test-hooks"]

[[bin]]
name = "x11-runner"
path = "src/tauri/bin/x11-runner.rs"
required-features = ["test-hooks"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.6", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.39"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
gtk = "0.18"
ashpd = { version = "0.11", default-features = false, features = ["async-std"], optional = true }
pollster = { version = "0.4", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", optional = true }
objc2-core-graphics = { version = "0.3", optional = true }
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKPreferences", "WKUIDelegate", "WKUserContentController", "WKUserScript", "WKWebView", "WKWebViewConfiguration"] }

[features]
test-hooks = ["dep:objc2-app-kit", "dep:objc2-core-graphics", "dep:ashpd", "dep:pollster", "dep:image", "dep:libc"]

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
